name: Labeler

# On pull requests
on: [pull_request_target]

jobs:
  triage:
    name: Label

    runs-on: ubuntu-latest

    steps:
      - name: 🔖 Label
        uses: actions/labeler@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: ".github/labeler.yml"
